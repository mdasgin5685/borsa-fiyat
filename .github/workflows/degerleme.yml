name: Degerleme
on:
  schedule:
    - cron: "17 4 1 * *"   # her ayın 1'i 07:17 İstanbul
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["valuation.py", ".github/workflows/degerleme.yml"]
permissions:
  contents: write
concurrency:
  group: degerleme
  cancel-in-progress: true
jobs:
  degerleme:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance
      - run: timeout 1500 python -u valuation.py 2>&1 | tee valuation.log
      - if: always()
        run: |
          git config user.name "fiyat-bot"; git config user.email "bot@users.noreply.github.com"
          git add valuation.log; [ -f valuation.json ] && git add valuation.json; git commit -m "Değerleme $(date +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done
