name: Probe
on:
  push:
    branches: [main]
    paths: ["probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance
      - run: python probe.py
      - run: |
          git config user.name "fiyat-bot"; git config user.email "bot@users.noreply.github.com"
          git add probe.json; git commit -m "probe" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
