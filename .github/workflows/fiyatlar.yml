name: Fiyatlar
on:
  schedule:
    - cron: "40 8 * * 1-5"    # 11:40 İstanbul (gün içi)
    - cron: "20 15 * * 1-5"   # 18:20 İstanbul (kapanış)
    - cron: "55 15 * * 1-5"   # 18:55 İstanbul (yedek; GitHub zamanlaması gecikebilir)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["fetch.py", "tickers.txt", ".github/workflows/fiyatlar.yml"]
permissions:
  contents: write
concurrency:
  group: fiyat
  cancel-in-progress: true
jobs:
  fiyat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python fetch.py
      - run: |
          git config user.name "fiyat-bot"
          git config user.email "fiyat-bot@users.noreply.github.com"
          git add prices.json
          git commit -m "Fiyatlar $(TZ=Europe/Istanbul date +'%F %H:%M')" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
